<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#00A651">
    <title>BAMA Offline</title>
    <style>
        * { box-sizing: border-box; letter-spacing: 0; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #00A651;
            color: #fff;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 420px);
            text-align: center;
        }
        img {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, .18);
        }
        h1 {
            margin: 24px 0 10px;
            font-size: 2rem;
        }
        p {
            margin: 0 0 22px;
            line-height: 1.6;
        }
        button {
            min-height: 46px;
            border: 0;
            border-radius: 8px;
            padding: 0 18px;
            background: #fff;
            color: #007A3B;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <main>
        <img src="/pwa-icons/icon-192.png" alt="">
        <h1>You're offline</h1>
        <p>BAMA can keep the app shell ready, but live workspace actions need a connection.</p>
        <button type="button" onclick="window.location.reload()">Retry</button>
    </main>
</body>
</html>
